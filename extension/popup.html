<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PrivyVision — Privacy Inspector</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 320px;
        padding: 12px;
        color: #12151c;
        background: #ffffff;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #5b6472;
        margin: 0 0 6px;
      }
      p {
        font-size: 12px;
        margin: 0 0 8px;
      }
      .muted {
        color: #5b6472;
      }
      .section {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid #dbe0e8;
      }
      .status-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .badge {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 3px 7px;
        border-radius: 3px;
      }
      .badge-allowed {
        color: #1b7a4d;
        background: #e1f2e8;
      }
      .badge-blocked {
        color: #a8531b;
        background: #f7e8dc;
      }
      .badge-ambiguous {
        color: #2451b8;
        background: #e7edfb;
      }
      .status-text {
        font-size: 12px;
        color: #5b6472;
      }
      ul {
        margin: 0;
        padding-left: 16px;
        font-size: 12px;
      }
      li {
        margin-bottom: 3px;
        font-family: "Consolas", monospace;
        font-size: 11px;
      }
      .timestamp {
        margin-top: 12px;
        font-size: 10px;
        color: #93a1bc;
      }
      .hash {
        font-family: "Consolas", monospace;
        font-size: 10px;
        word-break: break-all;
        background: #eef1f6;
        padding: 6px 8px;
        border-radius: 4px;
        color: #12151c;
        margin: 0;
      }
      .settings-row {
        display: flex;
        gap: 6px;
      }
      .task-block {
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid #dbe0e8;
      }
      #task-input {
        flex: 1;
        font-size: 12px;
        padding: 6px 8px;
        border: 1px solid #dbe0e8;
        border-radius: 4px;
      }
      #run-task {
        font-size: 12px;
        font-weight: 600;
        padding: 6px 14px;
        border: 1px solid #1b7a4d;
        background: #1b7a4d;
        color: #ffffff;
        border-radius: 4px;
        cursor: pointer;
      }
      #run-task:hover {
        background: #156039;
      }
      #run-task:disabled {
        background: #93a1bc;
        border-color: #93a1bc;
        cursor: default;
      }
      #task-status {
        font-size: 11px;
        color: #5b6472;
        margin-top: 5px;
        min-height: 13px;
      }
      .hint {
        font-size: 10.5px;
        line-height: 1.45;
        margin: 0 0 8px;
      }
      .hint code {
        font-family: "Consolas", monospace;
        background: #eef1f6;
        padding: 0 3px;
        border-radius: 2px;
      }
      .profile-grid {
        display: grid;
        gap: 5px;
        margin-bottom: 7px;
      }
      .profile-grid input {
        font-size: 11.5px;
        padding: 5px 7px;
        border: 1px solid #dbe0e8;
        border-radius: 4px;
      }
      #save-profile {
        font-size: 11px;
        padding: 5px 12px;
        border: 1px solid #2451b8;
        background: #ffffff;
        color: #2451b8;
        border-radius: 4px;
        cursor: pointer;
      }
      #save-profile:hover {
        background: #e7edfb;
      }
      #profile-status {
        font-size: 10px;
        color: #1b7a4d;
        margin-top: 4px;
        min-height: 12px;
      }
      #server-url {
        flex: 1;
        font-size: 11px;
        font-family: "Consolas", monospace;
        padding: 5px 6px;
        border: 1px solid #dbe0e8;
        border-radius: 4px;
      }
      #save-server-url {
        font-size: 11px;
        padding: 5px 10px;
        border: 1px solid #2451b8;
        background: #2451b8;
        color: #ffffff;
        border-radius: 4px;
        cursor: pointer;
      }
      #save-server-url:hover {
        background: #1c3f96;
      }
      #save-status {
        font-size: 10px;
        color: #1b7a4d;
        margin-top: 4px;
        min-height: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Privacy Inspector</h1>

    <div class="task-block">
      <h2>Task</h2>
      <div class="settings-row">
        <input id="task-input" type="text" placeholder="e.g. log in" maxlength="500" />
        <button id="run-task">Run</button>
      </div>
      <div id="task-status"></div>
    </div>

    <div id="report">Loading…</div>

    <div class="section">
      <h2>My details (stored on this device only)</h2>
      <p class="muted hint">
        Chrome never shares its saved autofill with extensions, so enter what you want
        auto-filled here. These values stay local — the server only ever sees tokens
        like <code>[EMAIL_01]</code>.
      </p>
      <div class="profile-grid">
        <input id="p-person_name" type="text" placeholder="Full name" />
        <input id="p-email" type="text" placeholder="Email" />
        <input id="p-phone" type="text" placeholder="Phone" />
        <input id="p-address" type="text" placeholder="Address" />
      </div>
      <button id="save-profile">Save details</button>
      <div id="profile-status"></div>
    </div>

    <div class="section">
      <h2>Server</h2>
      <div class="settings-row">
        <input id="server-url" type="text" placeholder="http://127.0.0.1:8787/reason" />
        <button id="save-server-url">Save</button>
      </div>
      <div id="save-status"></div>
    </div>
    <script src="dist/popup.js"></script>
  </body>
</html>
